name: AIB-5.5 Linux Verification

# Manual only: no push, pull_request, or schedule trigger.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # 19 canonical general partitions + 9 canonical serialized shards.
  AIB55_EXPECTED_SHARDS: "28"
  AIB55_SHARD_TIMEOUT_SECONDS: "1200"
  AIB55_SERIALIZED_TIMEOUT_SECONDS: "900"
  AIB55_TARGETED_TIMEOUT_SECONDS: "600"

jobs:
  posix-lane:
    name: Ubuntu POSIX remote lane
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Install pnpm 9.15.4
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false
      - name: Install Node.js 24.11.0
        uses: actions/setup-node@v4
        with:
          node-version: "24.11.0"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies from the lockfile
        timeout-minutes: 20
        run: pnpm install --frozen-lockfile
      - name: Prepare plugin build dependencies
        timeout-minutes: 20
        run: pnpm --filter @paperclipai/plugin-sdk ensure-build-deps
      - name: Run targeted POSIX-only remote lane
        shell: bash
        timeout-minutes: 13
        run: |
          set -u
          mkdir -p .aib-ci
          cmd=(pnpm exec vitest run packages/adapter-utils/src/acpx-engine/execute.test.ts --reporter=default --reporter=json --outputFile=.aib-ci/targeted.json)
          printf '%s\n' "${cmd[*]}" > .aib-ci/targeted.cmd
          set +e
          timeout --signal=TERM --kill-after=30s "${AIB55_TARGETED_TIMEOUT_SECONDS}s" "${cmd[@]}" > .aib-ci/targeted.log 2>&1
          status=$?
          set -e
          echo "$status" > .aib-ci/targeted.exit
          echo "targeted exit=${status}" >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Upload targeted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aib55-targeted
          path: .aib-ci/
          if-no-files-found: warn
          retention-days: 7

  general-tests:
    name: General tests (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { group: general-server-without-chat, shard_index: 0, shard_count: 12, label: server-01 }
          - { group: general-server-without-chat, shard_index: 1, shard_count: 12, label: server-02 }
          - { group: general-server-without-chat, shard_index: 2, shard_count: 12, label: server-03 }
          - { group: general-server-without-chat, shard_index: 3, shard_count: 12, label: server-04 }
          - { group: general-server-without-chat, shard_index: 4, shard_count: 12, label: server-05 }
          - { group: general-server-without-chat, shard_index: 5, shard_count: 12, label: server-06 }
          - { group: general-server-without-chat, shard_index: 6, shard_count: 12, label: server-07 }
          - { group: general-server-without-chat, shard_index: 7, shard_count: 12, label: server-08 }
          - { group: general-server-without-chat, shard_index: 8, shard_count: 12, label: server-09 }
          - { group: general-server-without-chat, shard_index: 9, shard_count: 12, label: server-10 }
          - { group: general-server-without-chat, shard_index: 10, shard_count: 12, label: server-11 }
          - { group: general-server-without-chat, shard_index: 11, shard_count: 12, label: server-12 }
          - { group: general-chat, shard_index: 0, shard_count: 3, label: chat-01 }
          - { group: general-chat, shard_index: 1, shard_count: 3, label: chat-02 }
          - { group: general-chat, shard_index: 2, shard_count: 3, label: chat-03 }
          - { group: general-workspaces-a, shard_index: 0, shard_count: 2, label: workspaces-a-01 }
          - { group: general-workspaces-a, shard_index: 1, shard_count: 2, label: workspaces-a-02 }
          - { group: general-workspaces-b, label: workspaces-b }
          - { group: general-workspaces-c, label: workspaces-c }
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Install pnpm 9.15.4
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false
      - name: Install Node.js 24.11.0
        uses: actions/setup-node@v4
        with:
          node-version: "24.11.0"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies from the lockfile
        timeout-minutes: 20
        run: pnpm install --frozen-lockfile
      - name: Prepare plugin build dependencies
        timeout-minutes: 20
        run: pnpm --filter @paperclipai/plugin-sdk ensure-build-deps
      - name: Run ${{ matrix.label }}
        shell: bash
        timeout-minutes: 22
        run: |
          set -u
          mkdir -p .aib-ci
          label="${{ matrix.label }}"
          cmd=(pnpm test:run:general -- --group "${{ matrix.group }}")
          if [ -n "${{ matrix.shard_count }}" ]; then
            cmd+=(--shard-index "${{ matrix.shard_index }}" --shard-count "${{ matrix.shard_count }}")
          fi
          printf '%s\n' "${cmd[*]}" > ".aib-ci/${label}.cmd"
          set +e
          timeout --signal=TERM --kill-after=30s "${AIB55_SHARD_TIMEOUT_SECONDS}s" "${cmd[@]}" > ".aib-ci/${label}.log" 2>&1
          status=$?
          set -e
          echo "$status" > ".aib-ci/${label}.exit"
          echo "${label} exit=${status}" >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Upload ${{ matrix.label }} evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aib55-shard-${{ matrix.label }}
          path: .aib-ci/
          if-no-files-found: warn
          retention-days: 7

  serialized-tests:
    name: Serialized tests (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard_index: 0, shard_count: 9, label: ser-01 }
          - { shard_index: 1, shard_count: 9, label: ser-02 }
          - { shard_index: 2, shard_count: 9, label: ser-03 }
          - { shard_index: 3, shard_count: 9, label: ser-04 }
          - { shard_index: 4, shard_count: 9, label: ser-05 }
          - { shard_index: 5, shard_count: 9, label: ser-06 }
          - { shard_index: 6, shard_count: 9, label: ser-07 }
          - { shard_index: 7, shard_count: 9, label: ser-08 }
          - { shard_index: 8, shard_count: 9, label: ser-09 }
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Install pnpm 9.15.4
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false
      - name: Install Node.js 24.11.0
        uses: actions/setup-node@v4
        with:
          node-version: "24.11.0"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies from the lockfile
        timeout-minutes: 20
        run: pnpm install --frozen-lockfile
      - name: Prepare plugin build dependencies
        timeout-minutes: 20
        run: pnpm --filter @paperclipai/plugin-sdk ensure-build-deps
      - name: Run ${{ matrix.label }}
        shell: bash
        timeout-minutes: 18
        run: |
          set -u
          mkdir -p .aib-ci
          label="${{ matrix.label }}"
          cmd=(pnpm test:run:serialized -- --shard-index "${{ matrix.shard_index }}" --shard-count "${{ matrix.shard_count }}")
          printf '%s\n' "${cmd[*]}" > ".aib-ci/${label}.cmd"
          set +e
          timeout --signal=TERM --kill-after=30s "${AIB55_SERIALIZED_TIMEOUT_SECONDS}s" "${cmd[@]}" > ".aib-ci/${label}.log" 2>&1
          status=$?
          set -e
          echo "$status" > ".aib-ci/${label}.exit"
          echo "${label} exit=${status}" >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Upload ${{ matrix.label }} evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aib55-shard-${{ matrix.label }}
          path: .aib-ci/
          if-no-files-found: warn
          retention-days: 7

  evidence:
    name: Aggregate AIB-5.5 evidence
    needs: [posix-lane, general-tests, serialized-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download targeted evidence
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: aib55-targeted
          path: .aib-ci
          merge-multiple: true
      - name: Download shard evidence
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: aib55-shard-*
          path: .aib-ci
          merge-multiple: true
      - name: Build structured evidence
        continue-on-error: true
        run: python3 tools/aib_supervisor/ci_linux_evidence.py
      - name: Upload AIB-5.5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aib55-linux-evidence
          path: .aib-ci/aib55-evidence.json
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce AIB-5.5 gate
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path(".aib-ci/aib55-evidence.json")
          if not path.exists():
              raise SystemExit("AIB-5.5 evidence is missing")
          payload = json.loads(path.read_text(encoding="utf-8"))
          print(json.dumps({
              "status": payload.get("status"),
              "reasons": payload.get("reasons"),
              "shards": payload.get("tests", {}).get("full", {}).get("received_shards"),
          }, indent=2))
          raise SystemExit(0 if payload.get("status") == "passed" else 1)
          PY
